<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sorteio ao vivo — Apresentador</title>
  <link rel="stylesheet" href="style.css?v=4" />
</head>
<body class="host">
  <div class="marca-erj" role="img" aria-label="ERJ · Explosão Radical Jovem"></div>
  <h1>Escaneie para participar</h1>
  <div id="qrcode"></div>
  <p class="room-label" id="room-label"></p>

  <p class="count" id="count">0</p>
  <p class="count-label">pessoas conectadas</p>
  <p class="eligible-note" id="eligible-note"></p>

  <div class="actions">
    <button class="draw" id="draw-btn" disabled>Sortear</button>
    <button class="reset" id="reset-btn">Reset Geral</button>
  </div>

  <p class="winner-banner" id="winner-banner"></p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>
  <script src="config.js?v=4"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const room = params.get("room") || "sorteio-demo";
    document.getElementById("room-label").textContent = "sala: " + room;

    const participantUrl = new URL("index.html", location.href);
    participantUrl.search = "?room=" + encodeURIComponent(room);

    new QRCode(document.getElementById("qrcode"), {
      text: participantUrl.toString(),
      width: 260,
      height: 260,
    });

    const countEl = document.getElementById("count");
    const eligibleNoteEl = document.getElementById("eligible-note");
    const drawBtn = document.getElementById("draw-btn");
    const resetBtn = document.getElementById("reset-btn");
    const winnerBanner = document.getElementById("winner-banner");

    // ids já sorteados nesta sessão do apresentador — não voltam a sair
    // sorteados até um "Reset Geral"
    const sorteados = new Set();

    const supabaseClient = window.supabase.createClient(
      window.APP_CONFIG.SUPABASE_URL,
      window.APP_CONFIG.SUPABASE_ANON_KEY
    );

    const HOST_KEY = "__host__";
    const channel = supabaseClient.channel("sorteio-" + room, {
      config: { presence: { key: HOST_KEY } },
    });

    function getParticipantIds() {
      const state = channel.presenceState();
      return Object.keys(state).filter((key) => key !== HOST_KEY);
    }

    function getEligibleIds() {
      return getParticipantIds().filter((id) => !sorteados.has(id));
    }

    function refreshCount() {
      const ids = getParticipantIds();
      const eligible = getEligibleIds();
      countEl.textContent = ids.length;
      eligibleNoteEl.textContent = sorteados.size
        ? sorteados.size + " já sorteado(s) · " + eligible.length + " elegível(is)"
        : "";
      drawBtn.disabled = eligible.length === 0;
    }

    channel
      .on("presence", { event: "sync" }, refreshCount)
      .subscribe(async (status) => {
        if (status === "SUBSCRIBED") {
          await channel.track({ id: HOST_KEY });
          refreshCount();
        }
      });

    drawBtn.addEventListener("click", async () => {
      const eligible = getEligibleIds();
      if (eligible.length === 0) return;
      const winnerId = eligible[Math.floor(Math.random() * eligible.length)];
      sorteados.add(winnerId);
      await channel.send({
        type: "broadcast",
        event: "winner",
        payload: { id: winnerId },
      });
      winnerBanner.textContent = "Sorteado: " + winnerId.slice(0, 8) + "…";
      refreshCount();
    });

    resetBtn.addEventListener("click", async () => {
      sorteados.clear();
      await channel.send({ type: "broadcast", event: "reset", payload: {} });
      winnerBanner.textContent = "";
      refreshCount();
    });
  </script>
</body>
</html>
