<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Sorteio ao vivo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" media="print" onload="this.media='all';this.onload=null"
        href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@600&family=DM+Sans:wght@400;500&display=swap" />
  <noscript>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@600&family=DM+Sans:wght@400;500&display=swap" />
  </noscript>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="participante">
  <div class="ceu" aria-hidden="true"></div>
  <div class="explosao" id="explosao" aria-hidden="true"></div>
  <canvas class="explosao-canvas" id="explosao-canvas" aria-hidden="true"></canvas>

  <main class="palco">
    <!-- CENA 1: aguardando -->
    <section class="cena ativa" id="cena-espera">
      <div class="abertura">
        <div class="etiqueta">Sorteio ao vivo</div>
        <h1 id="title">Você está conectado!</h1>
        <p class="status" id="status">Aguarde sua missão...</p>
        <div class="pulse" id="pulse"></div>
      </div>
    </section>

    <!-- CENA 2: chamado (transição breve antes da missão) -->
    <section class="cena" id="cena-chamado">
      <svg class="marca" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 1.5c.6 3.4-1.2 4.7-2.6 6.2C7.6 9.6 6 11.3 6 14.3 6 18.4 8.9 22.5 12 22.5s6-4.1 6-8.2c0-2.6-1.2-4.3-2.6-5.9-.5 1.3-1.3 2.1-2.2 2.5.7-2.6.2-6-1.2-9.4z" />
      </svg>
      <p class="chamada">🎉 Você foi sorteado! 🎉</p>
    </section>

    <!-- CENA 3: missão revelada -->
    <section class="cena" id="cena-missao">
      <article class="cartao escalonado" aria-live="polite">
        <div class="selo">
          <i class="ponto" aria-hidden="true"></i>
          <span class="etiqueta">Sua missão</span>
        </div>
        <h2 class="nome" id="nome"></h2>
        <p class="quem" id="quem"></p>
        <p class="tarefa" id="tarefa"></p>
        <blockquote class="palavra">
          <q id="palavra"></q>
          <cite id="referencia"></cite>
        </blockquote>
      </article>
    </section>
  </main>

  <div class="marca-erj" role="img" aria-label="ERJ · Explosão Radical Jovem"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="missoes.js"></script>
  <script src="config.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const room = params.get("room") || "sorteio-demo";

    const STORAGE_KEY = "sorteio-my-id";
    let myId = sessionStorage.getItem(STORAGE_KEY);
    if (!myId) {
      myId = crypto.randomUUID();
      sessionStorage.setItem(STORAGE_KEY, myId);
    }

    const statusEl = document.getElementById("status");
    const $ = (id) => document.getElementById(id);
    const cenas = { espera: $("cena-espera"), chamado: $("cena-chamado"), missao: $("cena-missao") };
    const calmo = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    function trocarCena(destino) {
      Object.values(cenas).forEach((c) => c.classList.remove("ativa"));
      destino.classList.add("ativa");
    }

    // brasas — atmosfera de fundo, igual à erjmissao.html
    const TETO_BRASAS = 24;
    let relogioBrasas = null;
    function brasa(vidaBase) {
      if (calmo || document.hidden) return;
      if (document.getElementsByClassName("brasa").length >= TETO_BRASAS) return;
      const b = document.createElement("div");
      b.className = "brasa";
      const tam = 2 + Math.random() * 4;
      b.style.left = Math.random() * 100 + "vw";
      b.style.width = b.style.height = tam + "px";
      b.style.opacity = 0.35 + Math.random() * 0.55;
      b.style.setProperty("--desvio", Math.random() * 120 - 60 + "px");
      const vida = vidaBase + Math.random() * 4;
      b.style.animationDuration = vida + "s";
      document.body.appendChild(b);
      setTimeout(() => b.remove(), vida * 5000);
    }
    function iniciarBrasas() {
      if (calmo || relogioBrasas) return;
      relogioBrasas = setInterval(() => brasa(7), 620);
    }
    function pararBrasas() {
      clearInterval(relogioBrasas);
      relogioBrasas = null;
    }
    function labareda() {
      for (let i = 0; i < 24; i++) setTimeout(() => brasa(3.4), i * 26);
    }
    if (!calmo) {
      addEventListener("load", () => {
        iniciarBrasas();
        for (let i = 0; i < 6; i++) setTimeout(() => brasa(7), i * 260);
      });
      document.addEventListener("visibilitychange", () => {
        document.hidden ? pararBrasas() : iniciarBrasas();
      });
    }

    // sorteio de missão sem repetir enquanto houver missões novas nesta aba
    let sacola = [];
    let ultima = -1;
    function proximoIndiceMissao() {
      if (!sacola.length) {
        sacola = missoes.map((_, i) => i);
        for (let i = sacola.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [sacola[i], sacola[j]] = [sacola[j], sacola[i]];
        }
        if (sacola[sacola.length - 1] === ultima && sacola.length > 1) {
          [sacola[sacola.length - 1], sacola[0]] = [sacola[0], sacola[sacola.length - 1]];
        }
      }
      ultima = sacola.pop();
      return ultima;
    }

    function girar(missao, aoTerminar) {
      const alvo = $("nome");
      if (calmo) {
        alvo.textContent = missao.nome;
        aoTerminar();
        return;
      }
      let intervalo = 55, total = 0;
      (function passo() {
        alvo.textContent = missoes[Math.floor(Math.random() * missoes.length)].nome;
        total += intervalo;
        intervalo *= 1.19;
        if (total < 1450) {
          setTimeout(passo, intervalo);
        } else {
          alvo.textContent = missao.nome;
          alvo.classList.remove("brilho");
          void alvo.offsetWidth;
          alvo.classList.add("brilho");
          aoTerminar();
        }
      })();
    }

    function revelarMissao() {
      const missao = missoes[proximoIndiceMissao()];
      const versiculo = versiculos[Math.floor(Math.random() * versiculos.length)];

      const cartao = document.querySelector(".cartao");
      $("quem").style.opacity = $("tarefa").style.opacity = "0";
      document.querySelector(".palavra").style.opacity = "0";

      trocarCena(cenas.missao);
      cartao.classList.remove("escalonado");

      girar(missao, () => {
        labareda();
        $("quem").textContent = missao.quem;
        $("tarefa").textContent = missao.texto;
        $("palavra").textContent = versiculo.texto;
        $("referencia").textContent = versiculo.referencia;
        [$("quem"), $("tarefa"), document.querySelector(".palavra")].forEach((el, i) => {
          el.style.opacity = "";
          el.style.animation = "none";
          void el.offsetWidth;
          el.style.animation = `subir-suave .55s cubic-bezier(.22,1,.36,1) ${i * 0.09}s both`;
        });
      });
    }

    function showWaiting() {
      trocarCena(cenas.espera);
      statusEl.textContent = "Aguarde sua missão...";
    }

    // ---------- partículas "explosão galáctica" (canvas) ----------
    const canvasExplosao = $("explosao-canvas");
    const ctxExplosao = canvasExplosao.getContext("2d");
    const CORES_GALAXIA = ["#ffffff", "#c084fc", "#818cf8", "#f472b6", "#38bdf8", "#facc15"];
    let particulas = [];
    let particulasAnimando = false;

    function ajustarCanvasExplosao() {
      const dpr = window.devicePixelRatio || 1;
      canvasExplosao.width = innerWidth * dpr;
      canvasExplosao.height = innerHeight * dpr;
      ctxExplosao.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    ajustarCanvasExplosao();
    addEventListener("resize", ajustarCanvasExplosao);

    function criarParticulasGalaxia(xPct, yPct, quantidade) {
      const x = (xPct / 100) * innerWidth;
      const y = (yPct / 100) * innerHeight;
      for (let i = 0; i < quantidade; i++) {
        const ang = Math.random() * Math.PI * 2;
        const vel = 2.5 + Math.random() * 11;
        particulas.push({
          x, y,
          vx: Math.cos(ang) * vel,
          vy: Math.sin(ang) * vel,
          vida: 1,
          decaimento: 0.007 + Math.random() * 0.016,
          raio: 1 + Math.random() * 2.6,
          cor: CORES_GALAXIA[Math.floor(Math.random() * CORES_GALAXIA.length)],
        });
      }
    }

    function animarParticulasGalaxia() {
      ctxExplosao.clearRect(0, 0, innerWidth, innerHeight);
      ctxExplosao.globalCompositeOperation = "lighter";
      for (const p of particulas) {
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.965;
        p.vy *= 0.965;
        p.vida -= p.decaimento;
        if (p.vida <= 0) continue;
        ctxExplosao.globalAlpha = Math.max(p.vida, 0);
        ctxExplosao.fillStyle = p.cor;
        ctxExplosao.beginPath();
        ctxExplosao.arc(p.x, p.y, p.raio * (0.4 + p.vida), 0, Math.PI * 2);
        ctxExplosao.fill();
      }
      particulas = particulas.filter((p) => p.vida > 0);
      ctxExplosao.globalAlpha = 1;
      ctxExplosao.globalCompositeOperation = "source-over";
      if (particulas.length) {
        requestAnimationFrame(animarParticulasGalaxia);
      } else {
        particulasAnimando = false;
      }
    }

    function dispararParticulasGalaxia(xPct, yPct) {
      if (calmo) return;
      criarParticulasGalaxia(xPct, yPct, 90);
      if (!particulasAnimando) {
        particulasAnimando = true;
        requestAnimationFrame(animarParticulasGalaxia);
      }
    }

    function limparParticulasGalaxia() {
      particulas = [];
      ctxExplosao.clearRect(0, 0, innerWidth, innerHeight);
    }

    // timeouts da sequência de explosões, pra poder cancelar num reset
    let explosaoTimeoutIds = [];
    function limparExplosaoPendente() {
      explosaoTimeoutIds.forEach(clearTimeout);
      explosaoTimeoutIds = [];
      limparParticulasGalaxia();
    }

    function estourar(xPct, yPct) {
      const el = $("explosao");
      el.style.setProperty("--ox", xPct + "%");
      el.style.setProperty("--oy", yPct + "%");
      el.classList.remove("ativa");
      void el.offsetWidth;
      el.classList.add("ativa");
      if (!calmo) {
        document.body.classList.remove("tremendo");
        void document.body.offsetWidth;
        document.body.classList.add("tremendo");
      }
      dispararParticulasGalaxia(xPct, yPct);
      for (let i = 0; i < 40; i++) explosaoTimeoutIds.push(setTimeout(() => brasa(3.2), i * 16));
    }

    // sequência de vários estouros, em pontos diferentes da tela, pra dar
    // uma transição bem mais impactante antes de revelar a missão
    function dispararExplosao() {
      limparExplosaoPendente();
      if (calmo) {
        estourar(50, 45);
        return;
      }
      const pontos = [
        { x: 50, y: 45 },
        { x: 26, y: 60 },
        { x: 74, y: 36 },
        { x: 50, y: 50 },
      ];
      pontos.forEach((p, i) => {
        explosaoTimeoutIds.push(setTimeout(() => estourar(p.x, p.y), i * 420));
      });
    }

    const supabaseClient = window.supabase.createClient(
      window.APP_CONFIG.SUPABASE_URL,
      window.APP_CONFIG.SUPABASE_ANON_KEY
    );

    const channel = supabaseClient.channel("sorteio-" + room, {
      config: { presence: { key: myId } },
    });

    // guarda o timeout pendente da revelação, pra poder cancelar num reset
    let missaoTimeoutId = null;

    channel
      .on("broadcast", { event: "winner" }, ({ payload }) => {
        if (payload && payload.id === myId) {
          if (missaoTimeoutId) clearTimeout(missaoTimeoutId);
          dispararExplosao();
          trocarCena(cenas.chamado);
          missaoTimeoutId = setTimeout(() => {
            missaoTimeoutId = null;
            revelarMissao();
          }, calmo ? 200 : 3400);
        }
      })
      .on("broadcast", { event: "reset" }, () => {
        if (missaoTimeoutId) {
          clearTimeout(missaoTimeoutId);
          missaoTimeoutId = null;
        }
        limparExplosaoPendente();
        showWaiting();
      })
      .subscribe(async (status) => {
        if (status === "SUBSCRIBED") {
          await channel.track({ id: myId });
          statusEl.textContent = "Aguarde sua missão...";
        } else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") {
          statusEl.textContent = "Erro de conexão. Recarregue a página.";
        }
      });
  </script>
</body>
</html>
